  <aside id="feedback" class="feedback" role="status" aria-live="polite" aria-atomic="true"><strong id="selected-section"></strong>
   <p style="color: rgb(83, 97, 132); font-weight: 400; font-size: 14px;">Bahagian ini sedia untuk dibuka.</p><button id="close-feedback" class="close-feedback" type="button" aria-label="Tutup pemberitahuan">×</button>
  </aside>
  <script>
    const sectionNames = [
      "Takwim Prasekolah", "Senarai Nama Murid", "Koleksi Gambar",
      "OPR Aktiviti", "BMI 5-6 Tahun", "Surat-Menyurat",
      "Bahan Kursus / Bengkel", "SKPK", "IPPK", "GTK",
      "Laporan Perbelanjaan", "Pelbagai Borang"
    ];
    const sectionLinks = [
      "https://drive.google.com/drive/folders/1GjaBi1MK54b_mdPSZNxNiQS26noJDsLA?usp=drive_link", // Takwim Prasekolah
      "", // Senarai Nama Murid
      "", // Koleksi Gambar
      "", // OPR Aktiviti
      "https://drive.google.com/drive/folders/1iGUFzLG0flPIkPozfRmbsO-BKLBXkpZP?usp=drive_link", // BMI 5-6 Tahun
      "", // Surat-Menyurat
      "https://drive.google.com/drive/folders/1-LB4vszcJpaUxK3Die0-RkkPnps0tOE1?usp=drive_link", // Bahan Kursus / Bengkel
      "", // SKPK
      "https://drive.google.com/drive/folders/1gGx3XQHMyxVUiY1fFOHsQVgShPYgnPOp?usp=drive_link", // IPPK
      "https://drive.google.com/drive/folders/1lpFVZHXN9PqpxOCrrb_RnKbxZeLtOi_u?usp=drive_link", // GTK
      "", // Laporan Perbelanjaan
      "https://drive.google.com/drive/folders/1mWv9gnlleqSEtuuzd-B5mi4XuHfGQigg?usp=drive_link"  // Pelbagai Borang
    ];
    const feedback = document.getElementById("feedback");
    const selectedSection = document.getElementById("selected-section");
    let hideTimer;
    function closeFeedback() {
      feedback.classList.remove("visible");
      clearTimeout(hideTimer);
    }
    document.querySelectorAll(".section-card").forEach(card => {
      card.addEventListener("click", () => {
        const idx = Number(card.dataset.section);
        const url = sectionLinks[idx];
        if (url) {
          window.open(url, "_blank", "noopener");
          return;
        }
        selectedSection.textContent = sectionNames[idx];
        feedback.classList.add("visible");
        clearTimeout(hideTimer);
        hideTimer = setTimeout(closeFeedback, 5000);
      });
    });
    document.getElementById("close-feedback").addEventListener("click", closeFeedback);
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeFeedback();
    });
  </script>
